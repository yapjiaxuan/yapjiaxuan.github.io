<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usecase</title>
    <style>
        body {
            font-family: 'space grotesk', sans-serif;
            max-width: 1440px;
            margin: auto;
        }

        .container {
            display: flex;
            justify-content: left;
            margin: -20px 60px;
        }

        .container .logo img {
            width: 25px;
            height: 25px;
            margin-left: -30px;
            margin-bottom: -58px;

        }

        .right {
            display: flex;
            column-gap: 40px;
            justify-content: flex-end;
            margin-top: -70px;
            margin-right: 50px;
            line-height: 0;
            align-items: center;

        }

        .right .use-cases {
            background-color: #b9ff66;
            padding: 5px 10px;
            border-radius: 10px;
        }

        .container .logo {
            margin: 10px;
        }


        .right .request-quote {
            border: 1.5px solid #000;
            padding: 5px 28px 5px 28px;
            border-radius: 13px;
        }
    </style>

</head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&family=Space+Grotesk:wght@300..700&display=swap"
    rel="stylesheet">

<body>

    <div class="container">
        <div class="logo">
            <img src="image/logo.png" alt="logo">
            <h1>Positivus</h1>
        </div>
    </div>

    <div class="right">
        <div class="about">
            <p>About us</p>
        </div>

        <div class="services">
            <p>Services</p>
        </div>

        <div class="use-cases">
            <p>Use Cases</p>
        </div>

        <div class="pricing">
            <p>Pricing</p>
        </div>

        <div class="blog">
            <p>Blog</p>
        </div>

        <div class="request-quote">
            <p>Request a quote</p>
        </div>
    </div>

    <div class="center">
        <img src="image/illustration.png" alt="illustration">
    </div>

</body>

</html>
